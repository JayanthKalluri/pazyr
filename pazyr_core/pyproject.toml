[project]
name="pazyr_core"
version="0.1.0"
description="Shared utility for pazyr microservices"
readme = "README.md"
requires-python = ">=3.13"
authors= [
    { name = "Pazyr Team" }
]

dependencies = [
    "asyncpg>=0.31.0",
    "redis>=5.0.0",
    "weaviate-client>=4.20.5",
    "packaging>=26.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pazyr_core"]
package-dir = { "" = "." }
