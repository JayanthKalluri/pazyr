[project]
name="pazyr_core"
version="0.1.0"
description="Shared utility for pazyr microservices"
readme = "README.md"
requires-python = ">=3.12"
authors= [{ name = "Pazyr Team" }]

dependencies = [
    "asyncpg>=0.31.0",
    "redis>=5.0.0",
    "weaviate-client>=4.20.5",
    "packaging>=26.2",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.setuptools]
where = ["src"]
