[project]
name = "discovery_engine"
version = "0.1.0"
description = "Discovery service for Pazyr"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Pazyr Team" }
]

dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "arxiv>=2.4.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
discovery-engine = "discovery_engine.main:run"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "src/discovery_engine"
]