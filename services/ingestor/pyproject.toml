[project]
name = "pazyr-ingestor"
version = "0.1.0"
description = "Ingestor service for Pazyr"
readme = "README.md"
requires-python = ">=3.13"
authors= [
    { name = "Pazye Team" }
]

dependencies = [
  "pazyr_core>=0.1.0",
  "aiofiles>=25.1.0",
  "aiohttp>=3.13.5",
  "arxiv>=2.4.1",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestor"]
package-dir = {"" = "src"}